/ping360:
  ros__parameters:
    simulate: false
    connection: serial          # serial | udp
    port: /dev/ttyUSB0
    baudrate: 2000000         # Ping360 auto-bauds; falls back to 115200 if this fails
    host: 192.168.2.2           # udp only (Ping360 Ethernet / BlueOS)
    udp_port: 12345
    frame_id: ping360_link
    range_m: 20.0
    gain_setting: 0             # 0 low, 1 normal, 2 high
    transmit_frequency: 750     # kHz
    number_of_samples: 1200
    speed_of_sound: 1500.0      # m/s (fresh water ~1480, sea water ~1500-1540)
    transmit_duration: 0        # us, 0 = automatic
    start_angle: 0              # gradians (400 = 360 deg)
    stop_angle: 399
    step: 1
    sector_mode: sweep          # sweep | bounce
